# Igual ao Vortex: a cada push na main, publica a atualização OTA direto.
# Publica nos dois canais (preview e production) para funcionar com qualquer APK,
# não importa o perfil escolhido no "Build from GitHub". Os dois jobs rodam em paralelo.
# O app baixa sozinho e pergunta "Reiniciar?" (ou use Buscar atualizações em Configurações).
# Se um dia adicionar biblioteca nativa / permissão / ícone, rode o workflow
# "Gerar APK" (gerar-apk.yml) manualmente no expo.dev e instale o APK novo.
name: Atualizar app (OTA)

# Desligado do push: agora quem publica é o GitHub (.github/workflows/publicar-ota.yml),
# porque o plano grátis do Expo só dá 60 min/mês de workflow. Ainda dá pra rodar à mão no expo.dev.
on:
  workflow_dispatch: {}

jobs:
  publish_preview:
    name: Publicar (preview)
    type: update
    environment: preview
    params:
      channel: preview
      platform: android

  publish_production:
    name: Publicar (production)
    type: update
    environment: preview
    params:
      channel: production
      platform: android
