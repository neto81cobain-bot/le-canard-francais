# Roda sozinho a cada push na main (repositório ligado ao projeto no expo.dev).
#  • Só mudou código/conteúdo  → publica atualização OTA (o app baixa pelo botão
#    "Buscar atualizações" em Configurações).
#  • Mudou algo nativo (biblioteca nova, permissão, ícone…) → gera um APK novo.
name: Publicar

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview

  get_android_build:
    name: Procurar APK compatível
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview

  build_android:
    name: Gerar APK novo
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  update_android:
    name: Publicar atualização OTA
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: preview
      platform: android
